<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entradas Recorrentes</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mut:#6b7785;--bd:#dde3ea;--ac:#0f9d58;--acx:#fff;--dg:#d93025;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151b;--card:#1a222b;--tx:#e8edf2;--mut:#93a0ad;--bd:#2b3743;--ac:#34c77b;--acx:#06160d;--dg:#ff6b60;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151b;--card:#1a222b;--tx:#e8edf2;--mut:#93a0ad;--bd:#2b3743;--ac:#34c77b;--acx:#06160d;--dg:#ff6b60;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:4px 0 14px}
h2{font-size:1rem;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:.8rem;color:var(--mut);margin:8px 0 3px}
input,select,button{font:inherit;color:var(--tx)}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{cursor:pointer;border:0;border-radius:10px;padding:11px 14px}
.btn{background:var(--ac);color:var(--acx);font-weight:600;width:100%;margin-top:12px}
.ghost{background:transparent;border:1px solid var(--bd);padding:6px 10px;font-size:.8rem}
.big{text-align:center;padding:10px 0 4px}
.big small{color:var(--mut);display:block}
.big strong{font-size:2rem;color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.cell{border:1px solid var(--bd);border-radius:10px;padding:8px 10px;background:var(--bg);text-align:left}
.cell.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.cell small{display:block;color:var(--mut);font-size:.75rem}
.cell b{font-size:.95rem}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--bd)}
.item:first-child{border-top:0}
.item .d{font-weight:600}
.item .m{color:var(--mut);font-size:.8rem}
.item .v{text-align:right;white-space:nowrap}
.acts{display:flex;gap:6px;margin-top:4px;justify-content:flex-end}
.del{color:var(--dg)}
.empty{color:var(--mut);text-align:center;padding:12px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.8rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th{color:var(--mut);font-weight:600}
th:first-child,td:first-child{text-align:left}
tfoot td{font-weight:700;color:var(--ac)}
</style>
</head>
<body>
<main>
<h1>💰 Entradas recorrentes</h1>

<section class="card">
  <div class="big">
    <small id="lblTot">Total mensal</small>
    <strong id="tot">R$ 0,00</strong>
  </div>
  <div class="grid" id="grid"></div>
</section>

<section class="card">
  <h2 id="formTitle">Nova entrada</h2>
  <label for="desc">Descrição</label>
  <input id="desc" placeholder="Ex.: Salário, aluguel recebido…" maxlength="60">
  <div class="row">
    <div><label for="val">Valor (R$)</label><input id="val" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0,00"></div>
    <div><label for="freq">Frequência</label><select id="freq"></select></div>
  </div>
  <button class="btn" id="save">Adicionar</button>
  <button class="ghost" id="cancel" style="display:none;margin-top:8px;width:100%">Cancelar edição</button>
</section>

<section class="card">
  <h2>Minhas entradas</h2>
  <div id="list"></div>
</section>

<section class="card">
  <h2>Soma por período</h2>
  <div class="tw" id="tbl"></div>
</section>

<section class="card">
  <h2>Simulação e projeção</h2>
  <div class="row">
    <div><label for="pPer">Projetar por</label><select id="pPer"></select></div>
    <div><label for="pN">Quantidade de períodos</label><input id="pN" type="number" inputmode="numeric" min="1" max="366" value="12"></div>
  </div>
  <label for="pG">Reajuste anual das entradas (%)</label>
  <input id="pG" type="number" inputmode="decimal" step="0.1" value="0">
  <div class="big" style="margin-top:8px"><small id="pLbl">Acumulado projetado</small><strong id="pTot">R$ 0,00</strong><small id="pSub"></small></div>
  <div class="tw" id="pTbl"></div>
</section>
</main>

<script>
var F={
  diario:{n:'Diário',y:365},semanal:{n:'Semanal',y:52},quinzenal:{n:'Quinzenal',y:24},
  mensal:{n:'Mensal',y:12},bimestral:{n:'Bimestral',y:6},trimestral:{n:'Trimestral',y:4},
  semestral:{n:'Semestral',y:2},anual:{n:'Anual',y:1}
};
var KEY='entradas_recorrentes_v1',data=[],view='mensal',editId=null;
var $=function(i){return document.getElementById(i)};
var brl=function(n){return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})};

function load(){
  try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);data=o.data||[];view=o.view||'mensal'}}catch(e){}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify({data:data,view:view}))}catch(e){}
}
function annual(e){return e.valor*F[e.freq].y}
function totalIn(p){
  var a=data.reduce(function(s,e){return s+annual(e)},0);
  return a/F[p].y;
}
function render(){
  $('lblTot').textContent='Total '+F[view].n.toLowerCase();
  $('tot').textContent=brl(totalIn(view));
  var g='';
  Object.keys(F).forEach(function(k){
    g+='<button class="cell'+(k===view?' on':'')+'" data-k="'+k+'"><small>'+F[k].n+'</small><b>'+brl(totalIn(k))+'</b></button>';
  });
  $('grid').innerHTML=g;
  var l='';
  data.forEach(function(e){
    l+='<div class="item"><div><div class="d">'+esc(e.desc)+'</div><div class="m">'+brl(e.valor)+' · '+F[e.freq].n+'</div></div>'+
    '<div class="v"><b>'+brl(annual(e)/F[view].y)+'</b><div class="m">por período '+F[view].n.toLowerCase()+'</div>'+
    '<div class="acts"><button class="ghost" data-ed="'+e.id+'">Editar</button><button class="ghost del" data-del="'+e.id+'">Excluir</button></div></div></div>';
  });
  $('list').innerHTML=l||'<div class="empty">Nenhuma entrada ainda.</div>';
  var ks=Object.keys(F),t='';
  if(data.length){
    t='<table><thead><tr><th>Entrada</th>'+ks.map(function(k){return '<th>'+F[k].n+'</th>'}).join('')+'</tr></thead><tbody>';
    data.forEach(function(e){
      t+='<tr><td>'+esc(e.desc)+'</td>'+ks.map(function(k){return '<td>'+brl(annual(e)/F[k].y)+'</td>'}).join('')+'</tr>';
    });
    t+='</tbody><tfoot><tr><td>Total</td>'+ks.map(function(k){return '<td>'+brl(totalIn(k))+'</td>'}).join('')+'</tr></tfoot></table>';
  }else{t='<div class="empty">Nenhuma entrada ainda.</div>'}
  $('tbl').innerHTML=t;
  renderProj();
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function resetForm(){
  editId=null;$('desc').value='';$('val').value='';$('freq').value='mensal';
  $('save').textContent='Adicionar';$('formTitle').textContent='Nova entrada';$('cancel').style.display='none';
}
$('freq').innerHTML=Object.keys(F).map(function(k){return '<option value="'+k+'">'+F[k].n+'</option>'}).join('');
$('freq').value='mensal';

$('save').onclick=function(){
  var d=$('desc').value.trim(),v=parseFloat($('val').value),f=$('freq').value;
  if(!d){$('desc').focus();return}
  if(!(v>0)){$('val').focus();return}
  if(editId){
    data.forEach(function(e){if(e.id===editId){e.desc=d;e.valor=v;e.freq=f}});
  }else{
    data.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),desc:d,valor:v,freq:f});
  }
  save();resetForm();render();
};
$('cancel').onclick=resetForm;
$('grid').onclick=function(ev){
  var b=ev.target.closest('[data-k]');if(!b)return;
  view=b.getAttribute('data-k');save();render();
};
$('list').onclick=function(ev){
  var d=ev.target.closest('[data-del]'),e=ev.target.closest('[data-ed]');
  if(d){
    if(confirm('Excluir esta entrada?')){
      var id=d.getAttribute('data-del');
      data=data.filter(function(x){return x.id!==id});save();render();
    }
  }else if(e){
    var id2=e.getAttribute('data-ed'),it=data.filter(function(x){return x.id===id2})[0];
    if(!it)return;
    editId=id2;$('desc').value=it.desc;$('val').value=it.valor;$('freq').value=it.freq;
    $('save').textContent='Salvar alteração';$('formTitle').textContent='Editar entrada';$('cancel').style.display='block';
    $('desc').scrollIntoView({behavior:'smooth',block:'center'});
  }
};
function renderProj(){
  var k=$('pPer').value,n=Math.min(Math.max(parseInt($('pN').value,10)||1,1),366);
  var g=(parseFloat($('pG').value)||0)/100,base=totalIn(k),y=F[k].y,acc=0,rows='',hoje=Date.now();
  if(!data.length){$('pTot').textContent=brl(0);$('pSub').textContent='';$('pTbl').innerHTML='<div class="empty">Adicione entradas para ver a projeção.</div>';return}
  for(var i=0;i<n;i++){
    var v=base*Math.pow(1+g,Math.floor(i*365/y/365));acc+=v;
    if(i<60){
      var d=new Date(hoje+(i+1)*365/y*864e5).toLocaleDateString('pt-BR');
      rows+='<tr><td>'+(i+1)+'</td><td>'+d+'</td><td>'+brl(v)+'</td><td>'+brl(acc)+'</td></tr>';
    }
  }
  var anos=n/y,fim=new Date(hoje+n*365/y*864e5).toLocaleDateString('pt-BR');
  $('pLbl').textContent='Acumulado em '+n+' período(s) '+F[k].n.toLowerCase()+'(is)';
  $('pTot').textContent=brl(acc);
  $('pSub').textContent='Média de '+brl(acc/n)+' por período · até '+fim+' (≈ '+anos.toLocaleString('pt-BR',{maximumFractionDigits:2})+' ano(s))';
  $('pTbl').innerHTML='<table><thead><tr><th>Nº</th><th>Até</th><th>Entrada</th><th>Acumulado</th></tr></thead><tbody>'+rows+'</tbody></table>'+(n>60?'<div class="empty">Mostrando os 60 primeiros períodos; o total acima considera todos.</div>':'');
}
$('pPer').innerHTML=Object.keys(F).map(function(k){return '<option value="'+k+'">'+F[k].n+'</option>'}).join('');
$('pPer').value='mensal';
['pPer','pN','pG'].forEach(function(i){$(i).oninput=renderProj});
load();render();
</script>
</body>
</html>
